# Primeira linha de defesa: barra o segredo ANTES de virar commit.
# Instale uma vez:  pre-commit install
# Rode em tudo:     pre-commit run --all-files
# Re-pine os `rev:` por tag estavel; o Renovate atualiza.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        # Este projeto versiona .ogg pre-convertidos em midi_game/assets/midi/
        # (o maior hoje tem ~4.7MB); o limite so existe para pegar acidentes
        # bem maiores (ex.: dump de banco, binario grande sem querer).
        args: ["--maxkb=8192"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
